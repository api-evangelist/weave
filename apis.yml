aid: weave
name: Weave
description: 'Weave (Weave Communications, Inc., NYSE: WEAV) is an all-in-one customer communication and
  payments platform built for small and medium healthcare and services businesses — dental, optometry,
  veterinary, medical, and beyond. Weave brings together a cloud phone system (VoIP), two-way text messaging,
  appointment scheduling and reminders, online reviews, forms, and integrated payments so practices can
  automate front-office work, keep schedules full, get paid faster, and collect more reviews. For developers,
  Weave runs a Developer Platform at dp.getweave.com backed by an OpenID Connect / OAuth 2.0 authorization
  server (api.weaveconnect.com) that lets partners build apps and integrations against Weave data and
  events. A Y Combinator company (W14), Weave is HIPAA compliant and maintains ISO 27001 and SOC 2 Type
  2 attestations.'
